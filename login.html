<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CineStream</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-900 text-white font-sans">
    <!-- Navbar -->
    <nav class="bg-black py-4 px-6 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-red-600 font-bold text-2xl">CineStream</a>
            
            <a href="index.html" class="py-1 px-4 rounded-full border border-gray-700 hover:bg-gray-800 transition duration-300">
                <i class="fas fa-home mr-2"></i>Back to Home
            </a>
        </div>
    </nav>
    
    <!-- Login Form -->
    <div class="container mx-auto px-6 mt-12">
        <div class="max-w-md mx-auto bg-gray-800 rounded-lg overflow-hidden shadow-lg">
            <div class="py-4 px-6 bg-gray-900 border-b border-gray-800">
                <h2 class="text-xl font-bold text-center">Login to CineStream</h2>
            </div>
            
            <div class="p-6">
                <form id="loginForm">
                    <div class="mb-4">
                        <label for="email" class="block text-sm font-medium text-gray-400 mb-2">Email</label>
                        <input type="email" id="email" name="email" class="bg-gray-700 w-full px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-red-500 text-white" required>
                    </div>
                    
                    <div class="mb-6">
                        <label for="password" class="block text-sm font-medium text-gray-400 mb-2">Password</label>
                        <input type="password" id="password" name="password" class="bg-gray-700 w-full px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-red-500 text-white" required>
                    </div>
                    
                    <div id="loginError" class="text-red-500 text-sm mb-4 hidden"></div>
                    
                    <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-opacity-50 transition duration-300">
                        Login
                    </button>
                </form>
                
                <div class="mt-6 text-center text-sm">
                    <p class="text-gray-400">Don't have an account? <a href="register.html" class="text-red-500 hover:text-red-400">Register</a></p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="bg-black py-6 mt-12">
        <div class="container mx-auto px-6">
            <div class="border-t border-gray-800 pt-6 text-sm text-gray-400 text-center">
                <p>&copy; 2025 CineStream. All rights reserved. This is a demo project.</p>
                <p class="mt-2">This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
            </div>
        </div>
    </footer>
    
    <script type="module" src="js/auth.js"></script>
</body>
</html>
